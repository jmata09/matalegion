<style>
  :root {
    --ink: #14201f; --soft: #465654; --faint: #6d807d;
    --line: #e0e6e3; --bg: #fff; --green: #0f3d3e; --green-hi: #17585a;
    --amber: #b76e15; --wash-a: #dcebe8; --wash-b: #fbeed9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8efec; --soft: #a6b7b3; --faint: #7d8f8b;
      --line: #22322f; --bg: #0b1412; --amber: #f0b967;
      --wash-a: #113a38; --wash-b: #2a1f10;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 17px/1.62 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1000px 560px at 12% -8%, color-mix(in srgb, var(--wash-a) 55%, transparent), transparent 62%),
      radial-gradient(760px 460px at 88% 4%, color-mix(in srgb, var(--wash-b) 70%, transparent), transparent 58%),
      var(--bg);
    background-repeat: no-repeat;
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    min-height: 100%;
    max-width: 760px;
    margin-inline: auto;
    padding: 32px 16px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 40px;
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand svg { width: 40px; height: 40px; }
  .brand b { font-size: 1.02rem; letter-spacing: -.015em; }
  .eyebrow {
    margin: 0 0 18px; font-size: .74rem; font-weight: 700;
    letter-spacing: .13em; text-transform: uppercase; color: var(--amber);
  }
  h1 {
    margin: 0 0 24px; font-weight: 700; text-wrap: balance;
    font-size: clamp(2.6rem, 10.5vw, 4.6rem); line-height: 1.04; letter-spacing: -.038em;
  }
  .lede {
    margin: 0 0 30px; max-width: 46ch; color: var(--soft);
    font-size: clamp(1.06rem, 2.4vw, 1.24rem); text-wrap: pretty;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 14px 30px; border-radius: 999px;
    background: var(--green); color: #fff; font-weight: 650;
    text-decoration: none; transition: background .2s;
  }
  .btn:hover { background: var(--green-hi); }
  .btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
  footer {
    font-size: .84rem; color: var(--faint);
    border-top: 1px solid var(--line); padding-top: 20px;
  }
  @media (max-width: 520px) {
    body { font-size: 16px; background-attachment: scroll; }
    .page { gap: 32px; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>
<main class="page">

  <header class="brand">
    <svg viewBox="0 0 40 40" role="img" aria-label="Charlie's Call to Action">
      <circle cx="20" cy="20" r="19" fill="#0f3d3e"/>
      <path fill="#f0b967" d="M13.2 16.4c1.5 0 2.5 1.5 2.3 3.2-.2 1.6-1.4 2.7-2.8 2.4-1.4-.3-2.3-1.8-2-3.4.2-1.4 1.2-2.2 2.5-2.2Zm13.6 0c1.3 0 2.3.8 2.5 2.2.3 1.6-.6 3.1-2 3.4-1.4.3-2.6-.8-2.8-2.4-.2-1.7.8-3.2 2.3-3.2ZM20 22.6c3.6 0 6.6 2.6 6.6 5.4 0 1.9-1.6 2.9-3.6 2.4-1-.2-2-.4-3-.4s-2 .2-3 .4c-2 .5-3.6-.5-3.6-2.4 0-2.8 3-5.4 6.6-5.4Zm-3.9-10.9c1.2-.3 2.5.8 2.8 2.4.3 1.6-.4 3.1-1.7 3.4-1.2.3-2.5-.8-2.8-2.4-.3-1.6.4-3.1 1.7-3.4Zm7.8 0c1.3.3 2 1.8 1.7 3.4-.3 1.6-1.6 2.7-2.8 2.4-1.3-.3-2-1.8-1.7-3.4.3-1.6 1.6-2.7 2.8-2.4Z"/>
    </svg>
    <b>Charlie's Call to Action</b>
  </header>

  <section>
    <p class="eyebrow">501(c)(3) Nonprofit</p>
    <h1>Coming to<br>the rescue.</h1>
    <p class="lede">
      We rescue dogs from shelters and train them as service animals — giving a dog
      a second chance, and a person their independence.
    </p>
    <!-- TODO: this address works once you set up email on the domain. -->
    <a class="btn" href="mailto:info@charliescalltoaction.org">Get in touch</a>
  </section>

  <footer>
    &copy; 2026 Charlie's Call to Action &middot; A registered 501(c)(3) nonprofit organization
  </footer>

</main>
</body>
</html>
