name: Cloudflare cleanup (one-time)

# Deletes every Worker and Pages project in the Cloudflare account.
# Runs only when .github/cloudflare-cleanup-request is added or changed.
# Approved by the account owner on 2026-09-26 after a data backup.

on:
  push:
    paths:
      - .github/cloudflare-cleanup-request

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all Workers and Pages projects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          acct="$CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$acct" ]; then
            acct=$(curl -s "${auth[@]}" "$api/accounts" | jq -r '.result[0].id')
          fi
          [ -n "$acct" ] && [ "$acct" != null ] || { echo "::error::Could not determine account."; exit 1; }
          failed=0
          del() { # label url
            out=$(curl -s -X DELETE "${auth[@]}" "$2")
            if [ "$(echo "$out" | jq -r '.success')" = true ]; then echo "DELETED  $1"
            else echo "FAILED   $1 -> $(echo "$out" | jq -c '.errors')"; failed=1; fi
          }

          echo "== Worker custom domains"
          for row in $(curl -s "${auth[@]}" "$api/accounts/$acct/workers/domains" | jq -r '.result[]? | "\(.id)|\(.hostname)|\(.service)"'); do
            IFS='|' read -r id host svc <<<"$row"; del "domain $host (worker $svc)" "$api/accounts/$acct/workers/domains/$id"
          done

          echo "== Pages projects"
          for p in $(curl -s "${auth[@]}" "$api/accounts/$acct/pages/projects?per_page=100" | jq -r '.result[]?.name'); do
            for d in $(curl -s "${auth[@]}" "$api/accounts/$acct/pages/projects/$p/domains" | jq -r '.result[]?.name'); do
              del "pages domain $d ($p)" "$api/accounts/$acct/pages/projects/$p/domains/$d"
            done
            del "pages project $p" "$api/accounts/$acct/pages/projects/$p"
          done

          echo "== Workers"
          list=$(curl -s "${auth[@]}" "$api/accounts/$acct/workers/scripts")
          if [ "$(echo "$list" | jq -r '.success')" != true ]; then
            echo "FAILED   listing workers -> $(echo "$list" | jq -c '.errors')"; failed=1
          fi
          for w in $(echo "$list" | jq -r '.result[]?.id'); do
            del "worker $w" "$api/accounts/$acct/workers/scripts/$w?force=true"
          done

          echo "== Remaining"
          echo "workers: $(curl -s "${auth[@]}" "$api/accounts/$acct/workers/scripts" | jq -c '[.result[]?.id]')"
          echo "pages:   $(curl -s "${auth[@]}" "$api/accounts/$acct/pages/projects" | jq -c '[.result[]?.name]')"
          exit $failed
