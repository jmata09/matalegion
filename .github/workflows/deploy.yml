name: Deploy site

# Publishes the site to the Cloudflare Pages project "thematalegion".
# - Push to main        -> production deployment of that project
# - Push to any branch  -> preview deployment (its own *.pages.dev link)
# This never changes which site thematalegion.com points at; that is a
# separate, one-time step in the Cloudflare dashboard (see README).
#
# Needs two repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   CLOUDFLARE_API_TOKEN   Account > Cloudflare Pages > Edit
#   CLOUDFLARE_ACCOUNT_ID

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: thematalegion

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          [ -z "$CLOUDFLARE_API_TOKEN" ]  && { echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set."; missing=1; }
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && { echo "::error::CLOUDFLARE_ACCOUNT_ID is not set."; missing=1; }
          [ "$missing" = 1 ] && exit 1
          echo "Credentials present."

      - name: Collect site files
        run: |
          mkdir dist
          cp *.html styles.css favicon.svg _redirects dist/
          ls dist

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/$PROJECT")
          if [ "$code" = 200 ]; then echo "Project $PROJECT exists."; exit 0; fi
          if [ "$code" != 404 ]; then echo "::error::Cloudflare API returned $code checking the project (token or account ID is wrong, or the token lacks Pages:Edit)."; exit 1; fi
          curl -sf -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            -d "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" "$base" > /dev/null
          echo "Created project $PROJECT."

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT" --branch="${GITHUB_REF_NAME}"
