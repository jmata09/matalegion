name: Validate & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only ever needs to read the repo.
permissions:
  contents: read

env:
  PROJECT: charliescalltoaction

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markup, assets and placeholders
        run: python3 scripts/validate.py

  deploy:
    name: Deploy to Cloudflare Pages
    needs: validate
    # Only deploy real pushes to main. Pull requests stop at validation so an
    # unreviewed branch can never reach the live domain.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve and check credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Repository *variables* are stored and displayed in plain text, so the
          # token's value is never read here - only whether one exists, as a
          # boolean, to diagnose an entry put in the wrong tab. The account ID is
          # not sensitive, so it is accepted from either place.
          VAR_TOKEN_PRESENT: ${{ vars.CLOUDFLARE_API_TOKEN != '' }}
          VAR_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            missing=1
            if [ "$VAR_TOKEN_PRESENT" = "true" ]; then
              echo "::error::CLOUDFLARE_API_TOKEN is under Variables, not Secrets."
              echo "  Variables are stored and shown in plain text, so that token must be"
              echo "  treated as exposed: delete the variable, roll the token in Cloudflare,"
              echo "  then add the new one under the Secrets tab."
            else
              echo "::error::CLOUDFLARE_API_TOKEN is not set."
            fi
          fi

          account_id="$CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$account_id" ] && [ -n "$VAR_ACCOUNT_ID" ]; then
            echo "Using CLOUDFLARE_ACCOUNT_ID from repository variables (it is not sensitive)."
            account_id="$VAR_ACCOUNT_ID"
          fi
          if [ -z "$account_id" ]; then
            missing=1
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set."
          fi

          if [ "$missing" = "1" ]; then
            echo ""
            echo "Checklist - all four must be true:"
            echo "  1. Added to THIS repository (jmata09/matalegion), not another one"
            echo "  2. Under Settings > Secrets and variables > Actions"
            echo "  3. On the 'Secrets' tab - NOT 'Variables'"
            echo "  4. As a 'Repository secret' - NOT an 'Environment secret'"
            echo "     (this workflow declares no environment, so environment secrets"
            echo "      are never passed to it)"
            echo ""
            echo "Names are case-sensitive and must match exactly."
            echo "Token scope: Account > Cloudflare Pages > Edit (see docs/CLOUDFLARE-API.md)."
            exit 1
          fi

          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "Credentials present."

      # wrangler cannot create a Pages project non-interactively, so it errors out
      # if one does not exist. Create it here first; this no-ops once it is there.
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$base/$PROJECT" \
                   -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          if [ "$code" = "200" ]; then
            echo "Pages project '$PROJECT' already exists."
          elif [ "$code" = "404" ]; then
            echo "Pages project '$PROJECT' not found - creating it."
            curl -sS -X POST "$base" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" \
              > create.json
            python3 - <<'CHECK'
          import json, sys
          with open("create.json") as fh:
              data = json.load(fh)
          if not data.get("success"):
              msgs = "; ".join(e.get("message", "?") for e in data.get("errors", []))
              print("::error::Could not create Pages project: " + (msgs or "unknown error"))
              sys.exit(1)
          print("Created.")
          CHECK
          else
            echo "::error::Unexpected HTTP $code from the Cloudflare API. Check the token scope."
            exit 1
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4 pages deploy public \
            --project-name="$PROJECT" \
            --branch=main
