name = "tapins-rewards"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# The built SPA is served by the same Worker that serves /api, so the browser
# talks to one origin and there is no CORS surface to get wrong.
[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "tapins-rewards"
database_id = "995775cd-3849-465f-8628-43385526a497"

# CLUB_CODE and STAFF_CODE are secrets, not vars. Set them with:
#   npx wrangler secret put CLUB_CODE
#   npx wrangler secret put STAFF_CODE
